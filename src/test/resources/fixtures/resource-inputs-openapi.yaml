openapi: 3.1.1
info:
  title: Resource Inputs API
  version: 1.0.0
paths:
  /api/reviews:
    get:
      tags:
        - review
      operationId: readReviews
      parameters:
        - name: token
          in: header
          required: true
          schema:
            type: string
        - name: tokenValue
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The reviews
          content:
            application/json:
              schema:
                type: string
  /api/reviews/{token}:
    get:
      tags:
        - review
      operationId: readReview
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: tokenValue
          in: header
          required: true
          schema:
            type: string
        - name: tokenPath
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema:
                type: string
  /api/quoted:
    get:
      tags:
        - review
      operationId: readQuoted
      parameters:
        - name: "X-It's"
          in: header
          required: false
          schema:
            type: string
        - name: "it's"
          in: query
          required: false
          schema:
            type: string
        - name: "back\\slash"
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The quoted names
          content:
            application/json:
              schema:
                type: string
